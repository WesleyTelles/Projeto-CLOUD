<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mural da Coordenação</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --txt:#1b2733; --mut:#5b6b7a; --brd:#d9e1e8;
          --pri:#00508f; --ok:#1a7f4b; --bad:#b42318; --warn:#b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161d; --card:#18212b; --txt:#e6edf3; --mut:#9fb0bf; --brd:#2a3744;
            --pri:#5aa9f0; --ok:#4ccf8c; --bad:#ff8a80; --warn:#f0b35a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.5rem; color:var(--pri); }
  .card { background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:16px; margin-top:16px; }
  form { display:grid; grid-template-columns: 2fr 1.2fr 1fr 1fr auto; gap:10px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--mut); gap:4px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--brd);
                          background:var(--bg); color:var(--txt); }
  button { cursor:pointer; background:var(--pri); color:#fff; border-color:var(--pri); }
  button.sec { background:transparent; color:var(--txt); border-color:var(--brd); }
  button.perigo { background:transparent; color:var(--bad); border-color:var(--bad); }
  .abas { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .abas button[aria-pressed="true"] { background:var(--pri); color:#fff; border-color:var(--pri); }
  .abas button { background:transparent; color:var(--txt); }
  .cont { font-size:.75rem; margin-left:4px; opacity:.85; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--brd); vertical-align:middle; }
  th { font-size:.75rem; text-transform:uppercase; color:var(--mut); }
  .tag { padding:2px 8px; border-radius:999px; font-size:.75rem; border:1px solid var(--brd); }
  .atrasada { color:var(--bad); border-color:var(--bad); font-weight:600; }
  .concluida { color:var(--ok); border-color:var(--ok); }
  .alta { color:var(--bad); } .baixa { color:var(--mut); }
  tr.feita td:first-child { text-decoration: line-through; color:var(--mut); }
  .acoes { display:flex; gap:6px; flex-wrap:wrap; }
  #msg { min-height: 1.4em; margin-top:10px; font-weight:600; }
  #msg.erro { color:var(--bad); } #msg.ok { color:var(--ok); }
  #saude { font-size:.8rem; padding:4px 10px; border-radius:999px; border:1px solid var(--brd); }
  .vazio { color:var(--mut); padding:16px 0; }
  @media (max-width: 760px) { form { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mural da Coordenação</h1>
    <span id="saude" aria-live="polite">verificando banco…</span>
  </header>

  <section class="card" aria-labelledby="t-novo">
    <h2 id="t-novo" style="margin:0 0 10px;font-size:1rem">Nova tarefa</h2>
    <form id="form-nova" novalidate>
      <label>Título (3 a 120)
        <input name="titulo" required maxlength="200" autocomplete="off">
      </label>
      <label>Responsável
        <input name="responsavel" required maxlength="150" autocomplete="off">
      </label>
      <label>Prazo (opcional)
        <input name="prazo" type="date">
      </label>
      <label>Prioridade
        <select name="prioridade">
          <option value="baixa">baixa</option>
          <option value="média" selected>média</option>
          <option value="alta">alta</option>
        </select>
      </label>
      <button type="submit">Cadastrar</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <section class="card" aria-labelledby="t-lista">
    <h2 id="t-lista" style="margin:0 0 10px;font-size:1rem">Tarefas</h2>
    <div class="abas" id="abas"></div>
    <div style="margin-top:10px">
      <label style="max-width:260px">Filtrar por responsável
        <input id="filtro-resp" placeholder="parte do nome" autocomplete="off">
      </label>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Título</th><th>Responsável</th><th>Prioridade</th><th>Prazo</th><th>Situação</th><th>Ações</th></tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <div id="vazio" class="vazio" hidden>Nenhuma tarefa para este filtro.</div>
  </section>
</main>

<script>
'use strict';
const ABAS = [
  { chave: '', rotulo: 'Todas', cont: 'total' },
  { chave: 'pendentes', rotulo: 'Pendentes', cont: 'pendentes' },
  { chave: 'concluidas', rotulo: 'Concluídas', cont: 'concluidas' },
  { chave: 'atrasadas', rotulo: 'Atrasadas', cont: 'atrasadas' },
];
let filtro = '';
const $ = (s) => document.querySelector(s);

function mensagem(texto, tipo) {
  const el = $('#msg');
  el.textContent = texto || '';
  el.className = tipo || '';
}

async function chamar(metodo, url, corpo) {
  const opc = { method: metodo, headers: {} };
  if (corpo !== undefined) { opc.headers['Content-Type'] = 'application/json'; opc.body = JSON.stringify(corpo); }
  const r = await fetch(url, opc);
  const dados = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error((dados && dados.erro) || 'Falha ' + r.status);
  return dados;
}

function formatarPrazo(p) { if (!p) return '—'; const [a, m, d] = p.split('-'); return `${d}/${m}/${a}`; }
function formatarData(iso) { return iso ? new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Recife' }) : ''; }

function celula(texto, classe) {
  const td = document.createElement('td');
  if (classe) { const s = document.createElement('span'); s.className = classe; s.textContent = texto; td.appendChild(s); }
  else td.textContent = texto;
  return td;
}

function botao(texto, classe, aoClicar) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = texto; b.className = classe;
  b.addEventListener('click', aoClicar);
  return b;
}

async function acao(fn, sucesso) {
  try { await fn(); mensagem(sucesso, 'ok'); } catch (e) { mensagem(e.message, 'erro'); }
  await carregar();
}

function linha(t) {
  const tr = document.createElement('tr');
  if (t.situacao === 'concluida') tr.className = 'feita';
  tr.appendChild(celula(t.titulo));
  tr.appendChild(celula(t.responsavel));
  tr.appendChild(celula(t.prioridade, 'tag ' + (t.prioridade === 'alta' ? 'alta' : t.prioridade === 'baixa' ? 'baixa' : '')));
  tr.appendChild(celula(formatarPrazo(t.prazo)));
  let sit = 'pendente', cls = 'tag';
  if (t.situacao === 'concluida') { sit = 'concluída em ' + formatarData(t.concluida_em); cls = 'tag concluida'; }
  else if (t.atrasada) { sit = 'ATRASADA'; cls = 'tag atrasada'; }
  tr.appendChild(celula(sit, cls));
  const td = document.createElement('td'); td.className = 'acoes';
  if (t.situacao === 'pendente') {
    td.appendChild(botao('Concluir', 'sec', () => acao(() => chamar('PATCH', `/api/tarefas/${t.id}/concluir`), 'Tarefa concluída.')));
  } else {
    td.appendChild(botao('Reabrir', 'sec', () => acao(() => chamar('PATCH', `/api/tarefas/${t.id}/reabrir`), 'Tarefa reaberta.')));
  }
  td.appendChild(botao('Excluir', 'perigo', () => {
    if (confirm('Excluir esta tarefa definitivamente?')) acao(() => chamar('DELETE', `/api/tarefas/${t.id}`), 'Tarefa excluída.');
  }));
  tr.appendChild(td);
  return tr;
}

async function carregar() {
  try {
    const params = new URLSearchParams();
    if (filtro) params.set('situacao', filtro);
    const resp = $('#filtro-resp').value.trim();
    if (resp) params.set('responsavel', resp);
    const [lista, cont] = await Promise.all([
      chamar('GET', '/api/tarefas?' + params), chamar('GET', '/api/tarefas/contadores'),
    ]);
    const corpo = $('#corpo'); corpo.replaceChildren(...lista.tarefas.map(linha));
    $('#vazio').hidden = lista.tarefas.length > 0;
    desenharAbas(cont);
  } catch (e) { mensagem(e.message, 'erro'); }
}

function desenharAbas(cont) {
  const el = $('#abas'); el.replaceChildren();
  for (const a of ABAS) {
    const b = document.createElement('button'); b.type = 'button';
    b.setAttribute('aria-pressed', String(filtro === a.chave));
    b.textContent = a.rotulo;
    const s = document.createElement('span'); s.className = 'cont'; s.textContent = '(' + (cont ? cont[a.cont] : 0) + ')';
    b.appendChild(s);
    b.addEventListener('click', () => { filtro = a.chave; carregar(); });
    el.appendChild(b);
  }
}

async function saude() {
  const el = $('#saude');
  try {
    const r = await fetch('/health'); const d = await r.json();
    el.textContent = r.ok ? 'banco conectado · iniciado em ' + formatarData(d.iniciado_em) : 'banco indisponível';
    el.style.color = r.ok ? 'var(--ok)' : 'var(--bad)';
  } catch { el.textContent = 'sem resposta do servidor'; el.style.color = 'var(--bad)'; }
}

$('#form-nova').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const corpo = {
    titulo: f.titulo.value, responsavel: f.responsavel.value, prioridade: f.prioridade.value,
    prazo: f.prazo.value || null,
  };
  try {
    await chamar('POST', '/api/tarefas', corpo);
    mensagem('Tarefa cadastrada.', 'ok'); f.reset(); f.prioridade.value = 'média';
  } catch (e) { mensagem(e.message, 'erro'); }
  await carregar();
});
$('#filtro-resp').addEventListener('input', () => { clearTimeout(window.__t); window.__t = setTimeout(carregar, 250); });

saude(); carregar();
</script>
</body>
</html>
